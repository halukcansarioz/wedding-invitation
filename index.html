<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover, shrink-to-fit=no, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16171d" media="(prefers-color-scheme: dark)">
    
    <!-- Apple iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Düğün Davetiyesi">
    <meta name="apple-itunes-app" content="app-id=">
    
    <!-- Android specific -->
    <meta name="application-name" content="Düğün Davetiyesi">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Color scheme & format detection -->
    <meta name="format-detection" content="telephone=no, email=no, address=no">
    
    <!-- Safe area & notch support -->
    <meta name="supported-color-schemes" content="light dark">

    <script>
      (() => {
        if (/(?:^|\/)(?:admin|live)(?:\/|$)/.test(location.pathname) || location.hash.includes("type=recovery")) return;

        let heroImage = "/images/themes/lavanta/annie-spratt-NrflUuJJK0I-unsplash.webp";
        try {
          const savedSiteData = JSON.parse(localStorage.getItem("wedding-site-data") || "null");
          const savedHeroImage = savedSiteData?.invitation?.heroImage;
          if (typeof savedHeroImage === "string" && savedHeroImage.trim()) heroImage = savedHeroImage;
        } catch {}

        if (heroImage === "/images/themes/lavanta/annie-spratt-NrflUuJJK0I-unsplash.jpg") {
          heroImage = "/images/themes/lavanta/annie-spratt-NrflUuJJK0I-unsplash.webp";
        }

        try {
          const imageUrl = new URL(heroImage, location.origin);
          if (imageUrl.origin !== location.origin) return;

          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = imageUrl.href;
          preload.fetchPriority = "high";
          document.head.appendChild(preload);
        } catch {}
      })();
    </script>

    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Font preload hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Başlık ve Temel Açıklama -->
    <title>Handenur & Haluk Can | Düğün Davetiyesi</title>

    <meta property="og:image" content="/images/themes/lavanta/8.jpg">

    <!-- Twitter Card -->
