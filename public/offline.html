<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Çevrimdışısınız | Düğün Davetiyesi</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fffaf8; color: #4a3035; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; text-align: center; }
      main { max-width: 480px; }
      h1 { margin-bottom: 12px; }
      p { line-height: 1.6; }
      button { border: 0; border-radius: 999px; background: #8f4d5b; color: #fff; cursor: pointer; font: inherit; padding: 12px 22px; }
      button:focus-visible { outline: 3px solid #d59aa6; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true" style="font-size: 3rem">💌</div>
      <h1>Şu anda çevrimdışısınız</h1>
      <p>Bağlantınız geri geldiğinde davetiyeyi yenileyerek tekrar deneyebilirsiniz.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
