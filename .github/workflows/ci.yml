name: ci

on: [push]

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npm run dev &
        env:
          CI: true

      - run: npx --yes wait-on http://localhost:5173

      - run: npm run test

      - run: npm run build
